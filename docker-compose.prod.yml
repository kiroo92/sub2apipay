name: sub2apipay

# Published image connected to an existing Sub2API Docker network.
services:
  app:
    image: ${APP_IMAGE:-ghcr.io/kiroo92/sub2apipay}:${IMAGE_TAG:-latest}
    pull_policy: always
    ports:
      - '${APP_HOST:-127.0.0.1}:${APP_PORT:-8087}:3000'
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      SUB2API_BASE_URL: ${SUB2API_BASE_URL:?Set SUB2API_BASE_URL in .env}
      SUB2API_ADMIN_API_KEY: ${SUB2API_ADMIN_API_KEY:?Set SUB2API_ADMIN_API_KEY in .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in .env}
      LOTTERY_START_AT: '${LOTTERY_START_AT:-2026-08-01T00:00:00+08:00}'
      LOTTERY_END_AT: '${LOTTERY_END_AT:-2026-09-01T00:00:00+08:00}'
      LOTTERY_ADMIN_CONTACT: ${LOTTERY_ADMIN_CONTACT:-support@example.com}
      LOTTERY_VOUCHER_REDEMPTION_DAYS: ${LOTTERY_VOUCHER_REDEMPTION_DAYS:-7}
      HOSTNAME: 0.0.0.0
    networks:
      - sub2api-network
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}

networks:
  sub2api-network:
    external: true
    name: ${SUB2API_DOCKER_NETWORK:?Set SUB2API_DOCKER_NETWORK in .env}
