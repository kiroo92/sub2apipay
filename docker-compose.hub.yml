name: sub2apipay

# Deploy the published GHCR image with a bundled PostgreSQL database.
services:
  app:
    image: ${APP_IMAGE:-ghcr.io/kiroo92/sub2apipay}:${IMAGE_TAG:-latest}
    pull_policy: always
    ports:
      - '${APP_HOST:-127.0.0.1}:${APP_PORT:-4001}:3000'
    environment:
      DATABASE_URL: postgresql://sub2apipay:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/sub2apipay
      SUB2API_BASE_URL: ${SUB2API_BASE_URL:?Set SUB2API_BASE_URL in .env}
      SUB2API_ADMIN_API_KEY: ${SUB2API_ADMIN_API_KEY:?Set SUB2API_ADMIN_API_KEY in .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in .env}
      LOTTERY_START_AT: '${LOTTERY_START_AT:-2026-08-07T00:00:00+08:00}'
      LOTTERY_END_AT: '${LOTTERY_END_AT:-2026-09-01T00:00:00+08:00}'
      LOTTERY_ADMIN_CONTACT: ${LOTTERY_ADMIN_CONTACT:-support@example.com}
      LOTTERY_VOUCHER_REDEMPTION_DAYS: ${LOTTERY_VOUCHER_REDEMPTION_DAYS:-7}
      HOSTNAME: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}

  db:
    image: postgres:16-alpine
    pull_policy: always
    environment:
      POSTGRES_USER: sub2apipay
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: sub2apipay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sub2apipay -d sub2apipay']
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}

volumes:
  pgdata:
